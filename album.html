<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albumy – Prezent</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);background-attachment:fixed;min-height:100vh;padding:40px 20px}
  .container{max-width:1200px;margin:0 auto}
  h1{color:#fff;text-align:center;font-size:2.5em;text-shadow:2px 2px 4px rgba(0,0,0,.2)}
  .podtytul{color:#ffffffd9;text-align:center;margin:8px 0 24px}
  .back-link{display:block;width:fit-content;margin:20px auto 0;padding:10px 20px;color:#fff;text-decoration:none;background:rgba(255,255,255,.2);border-radius:25px;transition:background .3s}
  .back-link:hover{background:rgba(255,255,255,.3)}
  .gifts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:25px}
  .gift-card{position:relative;background:#fff;border-radius:15px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;transition:transform .3s,box-shadow .3s}
  .gift-card:hover{transform:translateY(-5px);box-shadow:0 15px 40px rgba(0,0,0,.3)}
  .gift-card img{width:200px;height:200px;object-fit:cover;border-radius:10px;margin-bottom:15px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
  .numer{position:absolute;top:12px;left:12px;background:#764ba2;color:#fff;font-weight:bold;font-size:.85em;min-width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:0 8px}
  .gift-title{font-size:1.3em;font-weight:bold;color:#333;margin-bottom:8px;text-align:center}
  .gift-description{color:#666;text-align:center;font-size:.95em}
  .shop-buttons{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap;justify-content:center}
  .shop-btn{padding:7px 14px;border-radius:20px;font-size:.85em;font-weight:bold;text-decoration:none;transition:opacity .2s}
  .shop-btn:hover{opacity:.85}
  .btn-empik{background:#e3051b;color:#fff}
  .btn-amazon{background:#FF9900;color:#111}
  .btn-oficjalny{background:#222;color:#fff}
  .btn-discogs{background:#333;color:#ffcd3c}
  .kupione{opacity:.5}
  .kupione .gift-title::after{content:" ✅"}
  @media(max-width:600px){h1{font-size:2em}.gifts-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <h1>🎁 ALBUMY 🎁</h1>
  <p class="podtytul">+/- w kolejności od tych, które chciałbym najbardziej</p>
  <div class="gifts-grid" id="lista"></div>
  <a href="index.html" class="back-link">← POWRÓT DO STRONY GŁÓWNEJ</a>
</div>

<script>
/* ==================================================================
   DODAWANIE ALBUMU = skopiuj jedną linijkę, zmień dane, wklej
   w odpowiednim miejscu (kolejność na liście = kolejność na stronie,
   numerki #1, #2... doliczają się same).

   tytul   - tytuł albumu
   autor   - wykonawca
   zdjecie - nazwa pliku okładki (wrzuconego do repozytorium)
             albo adres z internetu (https://...)
   sklepy  - OPCJONALNE przyciski. Możliwe klucze:
             empik, amazon, oficjalny, discogs
             np. sklepy:{ empik:"https://...", discogs:"https://..." }
   kupione - true = karta szara z ✅ (możesz pominąć, jeśli nie kupione)
   ================================================================== */
const ALBUMY = [
  { tytul:"K.I.D.S. (Deluxe)",              autor:"Mac Miller",             zdjecie:"Mac_Miller_K.I.D.S._cover_art.jpg" },
  { tytul:"Live Love A$AP",                 autor:"A$AP Rocky",             zdjecie:"LLA.jpg" },
  { tytul:"BULLDAWG",                       autor:"Kenny Mason",            zdjecie:"bulldawg.webp" },
  { tytul:"Blond",                          autor:"Frank Ocean",            zdjecie:"ddc0e21aee890466270fcf3206f2ad0b.jpg" },
  { tytul:"Trojan Horse",                    autor:"Matt Proxy",                zdjecie:"https://i.scdn.co/image/ab67616d0000b27319016981e7bff147ae117722" },
  { tytul:"Alfredo 2",                    autor:"Freddie Gibbs",                zdjecie:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGPQPQGGsXgPNQMpVF6dElQymi5goJVlk69gd9zH9q4Q&s=10" },
  { tytul:"Graduation",                     autor:"Kanye West",             zdjecie:"Graduation_(album).jpg" },
  { tytul:"good kid, m.A.A.d city (Deluxe)",autor:"Kendrick Lamar",         zdjecie:"81e-3lhg4rL.jpg" },
  { tytul:"ii",                         autor:"denzel curry, kenny beats",            zdjecie:"https://f4.bcbits.com/img/a3798875210_16.jpg" },
   { tytul:"MM.Food",   autor:"Mf Doom",           zdjecie:"https://cdn-images.dzcdn.net/images/cover/eb41db75ea6b22ad495876e7fa944bb4/0x1900-000000-80-0-0.jpg" },
  { tytul:"Melt My Eyez See Your Future",   autor:"Denzel Curry",           zdjecie:"MMESYF.png" },
  { tytul:"Guitar",                         autor:"Mac DeMarco",            zdjecie:"guitar.webp" },
  { tytul:"The Fall-Off",                   autor:"J. Cole",                zdjecie:"release-image.3f6a5d13.webp" },
  { tytul:"Cry Baby",                  autor:"Vince Staples",             zdjecie:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRtykeUGibDWggIfpUQdf0uVO-DRHxUoZusjoeYdsefvA&s=10" },
  { tytul:"Watch the throne(deluxe)",       autor:"Kanye west, Jay-z",      zdjecie:"https://thumb.wikimedia.org/wikipedia/en/thumb/e/ee/Watch_The_Throne.jpg/250px-Watch_The_Throne.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail" },
  { tytul:"Let God Sort Em Out",            autor:"Clipse",                 zdjecie:"clipse.jpg" },
  { tytul:"Faces",                          autor:"Mac Miller",             zdjecie:"MacMillerFaces.jpg" },
  { tytul:"The Forever Story",              autor:"JID",                    zdjecie:"JID.png" },
  { tytul:"Finally rich",                   autor:"Chief keef",                zdjecie:"https://cdn-images.dzcdn.net/images/cover/867266ef5195999154c518fd8cf2aea5/0x1900-000000-80-0-0.jpg" },
  { tytul:"Don't Be Dumb",                  autor:"A$AP Rocky",             zdjecie:"DBD.png" },
  { tytul:"Illmatic",                       autor:"Nas",                    zdjecie:"nas.jpg" },
  { tytul:"From the Private Collection",    autor:"Saba, No ID",            zdjecie:"NOID.jpg" },
  { tytul:"Magic, Alive!",                  autor:"McKinley Dixon",         zdjecie:"MA.jpg" },
];

/* ================= NIE MUSISZ TEGO RUSZAĆ ================= */
const NAZWY_SKLEPOW = { empik:"Empik", amazon:"Amazon", oficjalny:"Sklep oficjalny", discogs:"Discogs" };
const lista = document.getElementById("lista");

ALBUMY.forEach((a, i) => {
  const karta = document.createElement("div");
  karta.className = "gift-card" + (a.kupione ? " kupione" : "");

  const numer = Object.assign(document.createElement("div"), { className:"numer", textContent:"#" + (i + 1) });
  const img = Object.assign(document.createElement("img"), { src:a.zdjecie, alt:a.tytul + " – okładka", loading:"lazy" });
  const tytul = Object.assign(document.createElement("div"), { className:"gift-title", textContent:a.tytul });
  const autor = Object.assign(document.createElement("div"), { className:"gift-description", textContent:"Autor: " + a.autor });
  karta.append(numer, img, tytul, autor);

  if (a.sklepy) {
    const box = Object.assign(document.createElement("div"), { className:"shop-buttons" });
    Object.entries(a.sklepy).forEach(([klucz, url]) => {
      box.append(Object.assign(document.createElement("a"), {
        className:"shop-btn btn-" + klucz, href:url, target:"_blank", rel:"noopener",
        textContent:NAZWY_SKLEPOW[klucz] || klucz
      }));
    });
    karta.append(box);
  }
  lista.append(karta);
});
</script>
</body>
</html>
